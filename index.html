<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Project Lessons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/scratchblocks@3.6.4/build/scratchblocks.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        'dark-bg': '#000000',
                        'dark-nav': '#111111',
                        'dark-content': '#1a1a1a',
                        'dark-text': '#e5e5e5',
                        'dark-subtext': '#a0a0a0',
                        'dark-hover': '#333333',
                        'dark-accent': '#00aaff',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111111; }
        ::-webkit-scrollbar-thumb { background: #444444; }
        ::-webkit-scrollbar-thumb:hover { background: #666666; }
        .active-step {
            background-color: #2a2a2a;
            color: #00aaff;
            font-weight: 600;
            border-left: 3px solid #00aaff;
            padding-left: 0.75rem; /* 12px */
        }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details > summary::before {
            content: '▶';
            margin-right: 0.5rem;
            display: inline-block;
            transition: transform 0.2s;
        }
        details[open] > summary::before { transform: rotate(90deg); }

        .cat-motion { color: #4C97FF; font-weight: 600; }
        .cat-looks { color: #9966FF; font-weight: 600; }
        .cat-sound { color: #CF63CF; font-weight: 600; }
        .cat-events { color: #FFBF00; font-weight: 600; }
        .cat-control { color: #FFAB19; font-weight: 600; }
        .cat-sensing { color: #5CB1D6; font-weight: 600; }
        .cat-operators { color: #59C059; font-weight: 600; }
        .cat-variables { color: #FF8C1A; font-weight: 600; }
        .cat-my-blocks { color: #FF6680; font-weight: 600; }

        .video-container {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            border-radius: 0.5rem; /* rounded-lg */
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
        }
        /* Make scratchblocks render inline and align with text */
        .scratchblocks {
            display: inline-block;
            vertical-align: middle;
            margin: 0 0.15em;
        }
    </style>
</head>
<body class="bg-dark-bg text-dark-text h-full flex flex-col font-sans">

    <header class="bg-dark-nav shadow-lg p-4 flex items-center z-10">
        <h1 class="text-xl font-bold mr-6 text-white">Scratch Lessons</h1>
        <div class="relative">
            <select id="lesson-select" class="bg-dark-content border border-dark-hover rounded-md px-3 py-2 appearance-none focus:outline-none focus:ring-2 focus:ring-dark-accent text-white">
                <!-- Lessons populated by JS -->
            </select>
        </div>
    </header>

    <main class="flex-grow grid grid-cols-1 md:grid-cols-5 h-full overflow-hidden">
        <nav id="steps-nav" class="bg-dark-nav col-span-1 p-4 overflow-y-auto border-r border-dark-hover">
            <h2 class="text-lg font-semibold mb-4 text-white">Project Milestones</h2>
            <ul id="steps-list" class="space-y-1">
                <!-- Steps populated by JS -->
            </ul>
        </nav>
        <section id="content-area" class="col-span-1 md:col-span-4 p-6 md:p-10 overflow-y-auto">
            <div class="text-center text-dark-subtext h-full flex flex-col justify-center items-center">
                <div class="bg-dark-nav p-8 rounded-lg">
                    <h2 class="text-2xl font-bold text-white mb-2">Welcome!</h2>
                    <p>Select a lesson from the dropdown menu to begin your project.</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lessonSelect = document.getElementById('lesson-select');
            const stepsList = document.getElementById('steps-list');
            const contentArea = document.getElementById('content-area');
            const stepsNavTitle = document.querySelector('#steps-nav h2');
            let currentLessonData = null;
            let currentLessonSlug = null;

            // --- PROGRESS TRACKING FUNCTIONS ---
            const getProgress = () => JSON.parse(localStorage.getItem('scratchProgress') || '{}');
            const saveProgress = (prog) => localStorage.setItem('scratchProgress', JSON.stringify(prog));
            const markCompleted = (slug, index) => {
                const prog = getProgress();
                if (!prog[slug]) prog[slug] =[];
                if (!prog[slug].includes(index)) {
                    prog[slug].push(index);
                    saveProgress(prog);
                }
            };

            // --- HELPER TO FIX THE HTML TAG BUG ---
            const formatScratchCode = (text) => {
                return text.replace(/`([^`]+)`/g, (match, code) => {
                    const escapedCode = code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    return `<code class="scratchblocks">${escapedCode}</code>`;
                });
            };

            const loadLessons = async () => {
                try {
                    const response = await fetch('./curriculum/lessons.json');
                    if (!response.ok) throw new Error('Network response was not ok');
                    const lessonSlugs = await response.json();
                    lessonSelect.innerHTML = '<option disabled selected>Choose a project...</option>';
                    lessonSlugs.forEach(slug => {
                        const option = document.createElement('option');
                        option.value = slug;
                        option.textContent = slug.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        lessonSelect.appendChild(option);
                    });
                } catch (error) {
                    contentArea.innerHTML = `<p class="text-red-400">Error: Could not load the lesson list. Please make sure 'curriculum/lessons.json' exists and you are using a local server.</p>`;
                }
            };

            const loadLessonData = async (lessonSlug) => {
                try {
                    stepsList.innerHTML = '';
                    contentArea.innerHTML = `<p class="text-dark-subtext">Loading lesson...</p>`;
                    const response = await fetch(`./curriculum/${lessonSlug}.json`);
                    if (!response.ok) throw new Error('Lesson file not found');
                    
                    currentLessonData = await response.json();
                    currentLessonSlug = lessonSlug;
                    stepsNavTitle.textContent = currentLessonData.title;
                    
                    populateSteps(currentLessonData.steps);
                    displayWelcome(currentLessonData);
                } catch (error) {
                    // Fixed the closing </p> tag typo here
                    contentArea.innerHTML = `<p class="text-red-400">Error: Could not load lesson '${lessonSlug}'.</p>`;
                }
            };

            const populateSteps = (steps) => {
                stepsList.innerHTML = ''; // Clear list before repopulating
                const prog = getProgress()[currentLessonSlug] ||[];
                
                steps.forEach((step, index) => {
                    const isCompleted = prog.includes(index);
                    const li = document.createElement('li');
                    
                    li.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span><span class="font-semibold text-dark-accent mr-2">${index + 1}.</span> ${step.title}</span>
                            ${isCompleted ? '<span class="text-green-500 font-bold ml-2">✓</span>' : ''}
                        </div>
                    `;
                    
                    li.dataset.stepIndex = index;
                    li.className = 'cursor-pointer p-2 rounded-md hover:bg-dark-hover transition-colors text-dark-subtext';
                    stepsList.appendChild(li);
                });
            };

            const displayWelcome = (lesson) => {
                contentArea.innerHTML = `
                    <div class="bg-dark-nav p-8 rounded-lg space-y-4">
                        <h2 class="text-4xl font-bold text-white">${lesson.title}</h2>
                        <p class="text-lg text-dark-subtext">${lesson.description}</p>
                        <p class="text-dark-accent font-semibold pt-4">Click on the first milestone on the left to get started!</p>
                    </div>
                `;
            };

            const displayStep = (stepIndex) => {
                stepIndex = parseInt(stepIndex);
                const step = currentLessonData.steps[stepIndex];
                if (!step) return;

                // Fix Bug A: Format hints properly
                const hintsHtml = step.hints.map((hint, index) => `
                    <details class="bg-dark-nav rounded-lg mt-2">
                        <summary class="cursor-pointer font-semibold p-3 text-white hover:bg-dark-hover rounded-t-lg">Hint ${index + 1}</summary>
                        <div class="p-4 border-t border-dark-hover text-dark-subtext">${formatScratchCode(hint)}</div>
                    </details>
                `).join('');

                // Fix Bug A: Format main content properly
                let processedContent = formatScratchCode(step.content);

                if (step.youtubeID) {
                    const videoHtml = `
                        <div class="video-container mt-6">
                            <iframe src="https://www.youtube.com/embed/${step.youtubeID}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                        <p class="text-center text-sm text-dark-subtext mt-2">
                            If the video doesn't load,
                            <a href="https://www.youtube.com/watch?v=${step.youtubeID}" target="_blank" rel="noopener noreferrer" class="text-dark-accent hover:underline">
                                watch it on YouTube
                            </a>.
                        </p>
                    `;
                    processedContent += videoHtml;
                }

                let finishedCodeHtml = '';
                if (step.finishedCode && step.finishedCode.length > 0) {
                    const codeBlocks = step.finishedCode.map(code => {
                        let label = '';
                        let script = code;
                        if (script.startsWith('//')) {
                            const firstLineEnd = script.indexOf('\n');
                            label = `<p class="text-sm text-dark-subtext mb-1">${script.substring(2, firstLineEnd).trim()}</p>`;
                            script = script.substring(firstLineEnd + 1);
                        }
                        return `<div class="mb-4">${label}<pre class="scratchblocks">${script}</pre></div>`;
                    }).join('');

                    finishedCodeHtml = `
                        <div class="pt-4 mt-6 border-t border-dark-hover">
                            <h3 class="text-xl font-semibold mb-2 text-white">Finished Code</h3>
                            <details class="bg-dark-nav rounded-lg finished-code-details">
                                <summary class="cursor-pointer font-semibold p-3 text-white hover:bg-dark-hover rounded-lg">
                                    Click to reveal the final code for this step
                                </summary>
                                <div class="p-4 border-t border-dark-hover">
                                    ${codeBlocks}
                                </div>
                            </details>
                        </div>
                    `;
                }

                // Feature: Next / Previous Buttons
                const navigationHtml = `
                    <div class="flex justify-between mt-10 pt-6 border-t border-dark-hover">
                        ${stepIndex > 0 
                            ? `<button data-target-step="${stepIndex - 1}" class="bg-dark-nav hover:bg-dark-hover text-white font-semibold py-2 px-4 rounded-md transition-colors border border-dark-hover">&larr; Previous</button>` 
                            : '<div></div>'}
                        ${stepIndex < currentLessonData.steps.length - 1 
                            ? `<button data-target-step="${stepIndex + 1}" class="bg-dark-accent hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-md transition-colors">Next Step &rarr;</button>` 
                            : '<div></div>'}
                    </div>
                `;

                contentArea.innerHTML = `
                    <div class="space-y-6">
                        <div>
                            <p class="text-sm font-semibold text-dark-accent">STEP ${stepIndex + 1} OF ${currentLessonData.steps.length}</p>
                            <h2 class="text-4xl font-bold text-white mt-1">${step.title}</h2>
                        </div>
                        <div class="text-lg text-dark-subtext space-y-4">${processedContent}</div>
                        <div class="pt-4">
                            <h3 class="text-xl font-semibold mb-2 text-white">Stuck? Check the hints!</h3>
                            ${hintsHtml}
                        </div>
                        ${finishedCodeHtml}
                        ${navigationHtml}
                    </div>
                `;

                // Render all visible scratch blocks initially
                try {
                    scratchblocks.renderMatching('.scratchblocks');
                } catch (e) {
                    console.error("Scratchblocks rendering failed:", e);
                }
            };

            const goToStep = (index) => {
                index = parseInt(index);
                
                // Track completion and refresh UI
                markCompleted(currentLessonSlug, index);
                populateSteps(currentLessonData.steps); 

                // Highlight active step
                document.querySelectorAll('#steps-list li').forEach(li => {
                    li.classList.remove('active-step');
                    if (parseInt(li.dataset.stepIndex) === index) {
                        li.classList.add('active-step');
                    }
                });

                displayStep(index);

                // Feature: Automatically scroll up on Mobile
                if (window.innerWidth < 768) {
                    contentArea.scrollIntoView({ behavior: 'smooth' });
                } else {
                    contentArea.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            lessonSelect.addEventListener('change', () => {
                const selectedLesson = lessonSelect.value;
                if (selectedLesson) loadLessonData(selectedLesson);
            });

            // Handle clicking steps in the sidebar menu
            stepsList.addEventListener('click', (e) => {
                const stepElement = e.target.closest('li');
                if (stepElement) {
                    goToStep(stepElement.dataset.stepIndex);
                }
            });

            // Handle Next/Prev button clicks (Event Delegation)
            contentArea.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-target-step]');
                if (btn) {
                    goToStep(btn.dataset.targetStep);
                }
            });

            // Fix Bug B: Only render scratchblocks inside the specific `<details>` block that was opened
            contentArea.addEventListener('toggle', (event) => {
                if (event.target.tagName === 'DETAILS' && event.target.open) {
                    try {
                        scratchblocks.renderMatching('details[open] .scratchblocks');
                    } catch (e) {
                        console.error("Scratchblocks re-rendering failed:", e);
                    }
                }
            }, true);

            loadLessons();
        });
    </script>
</body>
</html>
