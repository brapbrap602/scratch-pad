<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Project Lessons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/scratchblocks@3.6.4/build/scratchblocks.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      if (window.tailwind) {
        window.tailwind.config = {
          theme: {
            extend: {
              fontFamily: { sans: ['Poppins', 'sans-serif'] },
            },
          },
        };
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Poppins, system-ui, sans-serif;
        background: #000;
        color: #e5e5e5;
      }
      * { box-sizing: border-box; }
      body { background: #000; display: flex; flex-direction: column; height: 100vh; height: 100dvh; margin: 0; overflow: hidden; }
      button, select { font: inherit; }
      button, summary, select { min-height: 44px; }
      button:focus-visible, summary:focus-visible, select:focus-visible, a:focus-visible {
        outline: 3px solid #7dd3fc;
        outline-offset: 3px;
      }
      a { color: #38bdf8; }
      .site-header {
        align-items: center;
        background: #111;
        display: flex;
        gap: 1.5rem;
        padding: 1rem;
      }
      .site-header h1 { font-size: 1.25rem; margin: 0; white-space: nowrap; }
      .project-picker { display: grid; gap: .25rem; min-width: min(22rem, 100%); }
      .project-picker label { font-size: .8rem; font-weight: 600; }
      #lesson-select {
        background: #1a1a1a;
        border: 1px solid #555;
        border-radius: .4rem;
        color: #fff;
        padding: .55rem .75rem;
        width: 100%;
      }
      .app-shell { display: grid; flex: 1; grid-template-columns: minmax(16rem, 1fr) minmax(0, 4fr); min-height: 0; }
      .steps-nav { background: #111; border-right: 1px solid #444; min-height: 0; overflow-y: auto; padding: 1rem; }
      .steps-nav > h2 { font-size: 1.05rem; margin: 0 0 1rem; }
      .course-nav-toggle { display: none; }
      .chapter-group { margin: 0 0 1.5rem; }
      .chapter-group h3 { color: #fff; font-size: .9rem; margin: 0 0 .35rem; }
      .chapter-meta { color: #a3a3a3; font-size: .75rem; margin: 0 0 .5rem; }
      .step-list { display: grid; gap: .25rem; list-style: none; margin: 0; padding: 0; }
      .step-button {
        background: transparent;
        border: 0;
        border-left: 3px solid transparent;
        border-radius: .3rem;
        color: #d4d4d4;
        cursor: pointer;
        display: flex;
        gap: .5rem;
        justify-content: space-between;
        padding: .6rem;
        text-align: left;
        width: 100%;
      }
      .step-button:hover { background: #292929; }
      .step-button[aria-current="step"] { background: #292929; border-left-color: #38bdf8; color: #7dd3fc; font-weight: 600; }
      .completion-mark { color: #86efac; font-weight: 700; }
      .content-area { min-height: 0; overflow-y: auto; padding: 2rem clamp(1rem, 4vw, 3rem); scroll-behavior: smooth; }
      .content-column { margin: 0 auto; max-width: 74ch; }
      .card { background: #171717; border: 1px solid #333; border-radius: .65rem; padding: clamp(1rem, 4vw, 2rem); }
      .eyebrow { color: #7dd3fc; font-size: .8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      h2, h3, h4 { color: #fff; }
      .step-title { font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.15; margin: .25rem 0 1.5rem; }
      .prose { color: #d4d4d4; font-size: 1.05rem; line-height: 1.7; }
      .prose code { margin: 0 .15em; vertical-align: middle; }
      .instruction-list, .criteria-list { padding-left: 1.4rem; }
      .instruction-list li, .criteria-list li { margin: .5rem 0; }
      .checkpoint { background: #082f49; border: 1px solid #0ea5e9; border-radius: .65rem; margin-top: 1.5rem; padding: 1rem; }
      .checkpoint h3 { margin-top: 0; }
      details { background: #171717; border: 1px solid #3f3f46; border-radius: .5rem; margin-top: .65rem; }
      summary { cursor: pointer; display: flex; align-items: center; font-weight: 600; padding: .75rem; }
      .details-content { border-top: 1px solid #3f3f46; padding: 1rem; }
      .code-scroll { max-width: 100%; overflow-x: auto; }
      .code-label { color: #d4d4d4; font-size: .85rem; font-weight: 600; }
      .step-actions { align-items: center; border-top: 1px solid #444; display: flex; flex-wrap: wrap; gap: .75rem; justify-content: space-between; margin-top: 2rem; padding-top: 1.25rem; }
      .button { border: 1px solid #555; border-radius: .4rem; cursor: pointer; font-weight: 600; padding: .65rem 1rem; }
      .button-secondary { background: #171717; color: #fff; }
      .button-primary { background: #38bdf8; border-color: #38bdf8; color: #082f49; }
      .button-complete { background: #14532d; border-color: #4ade80; color: #f0fdf4; }
      .status { margin: 0; padding: .5rem 1rem; }
      .error { color: #fecaca; }
      .video-container { aspect-ratio: 16 / 9; margin-top: 1.5rem; overflow: hidden; }
      .video-container iframe { border: 0; height: 100%; width: 100%; }
      .cat-motion { color: #75adff; font-weight: 600; }
      .cat-looks { color: #b794ff; font-weight: 600; }
      .cat-sound { color: #e68ae6; font-weight: 600; }
      .cat-events { color: #ffd04a; font-weight: 600; }
      .cat-control { color: #ffc15c; font-weight: 600; }
      .cat-sensing { color: #79c9e8; font-weight: 600; }
      .cat-operators { color: #7bd47b; font-weight: 600; }
      .cat-variables { color: #ffad55; font-weight: 600; }
      .cat-my-blocks { color: #ff8ca0; font-weight: 600; }
      .visually-hidden {
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }
      @media (max-width: 767px) {
        body { height: auto; min-height: 100vh; min-height: 100dvh; overflow: visible; }
        .site-header { align-items: stretch; flex-direction: column; gap: .75rem; }
        .site-header h1 { white-space: normal; }
        .app-shell { display: block; height: auto; }
        .steps-nav { border-bottom: 1px solid #444; border-right: 0; max-height: none; overflow: visible; }
        .steps-nav > h2 { display: inline-block; margin-right: .75rem; }
        .course-nav-toggle { background: #171717; border: 1px solid #555; border-radius: .4rem; color: #fff; cursor: pointer; display: inline-block; padding: .45rem .75rem; }
        #steps-list.mobile-collapsed { display: none; }
        .content-area { overflow: visible; padding: 1rem; scroll-behavior: auto; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <h1>Scratch Lessons</h1>
      <div class="project-picker">
        <label for="lesson-select">Project</label>
        <select id="lesson-select" disabled>
          <option selected>Loading projects...</option>
        </select>
      </div>
    </header>
    <p id="app-status" class="status visually-hidden" role="status" aria-live="polite"></p>
    <p id="app-error" class="status error visually-hidden" role="alert"></p>
    <main class="app-shell">
      <nav class="steps-nav" aria-labelledby="steps-heading">
        <h2 id="steps-heading">Course chapters</h2>
        <button id="course-nav-toggle" class="course-nav-toggle" type="button" aria-controls="steps-list" aria-expanded="false">Show chapters</button>
        <div id="steps-list" class="mobile-collapsed"></div>
      </nav>
      <section id="content-area" class="content-area" aria-labelledby="content-heading">
        <div class="content-column card">
          <h2 id="content-heading">Welcome</h2>
          <p>Select a project to begin.</p>
        </div>
      </section>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
