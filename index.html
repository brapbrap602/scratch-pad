<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Project Lessons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/scratchblocks@3.6.4/build/scratchblocks.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      try {
        const savedTheme = localStorage.getItem('scratchLessonsTheme');
        if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
      } catch {}
      if (window.tailwind) {
        window.tailwind.config = {
          theme: {
            extend: {
              fontFamily: { sans: ['Nunito', 'sans-serif'] },
            },
          },
        };
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Nunito, system-ui, sans-serif;
        --heading-font: Poppins, system-ui, sans-serif;
        --canvas: #060a12;
        --sidebar: #111b30;
        --surface: #182338;
        --surface-raised: #202d42;
        --surface-hover: #293951;
        --text: #f3f1ed;
        --text-muted: #c3c8d4;
        --border: #718095;
        --border-subtle: #405673;
        --blue: #8ecae6;
        --blue-hover: #afdcec;
        --blue-ink: #102a3a;
        --blue-tint: #20354a;
        --sage: #a8d5ba;
        --sage-tint: #19372b;
        --butter: #f3d58a;
        --butter-tint: #302919;
        --peach: #e8a6a6;
        --header-bg: linear-gradient(115deg, #1a2a4a 0%, #243755 100%);
        --checkpoint-text: #fff6dc;
        --complete-text: #f2fff7;
        --complete-hover: #244a39;
        --notice: #c3c8d4;
        --error: #fecaca;
        --focus: var(--butter);
        --game-brick-breaker: #f6ad6b; --game-brick-breaker-tint: #3a2a1c;
        --game-space-invaders: #7fd99a; --game-space-invaders-tint: #1b3626;
        --game-tower-defense: #c2aefc; --game-tower-defense-tint: #2c2547;
        --accent: var(--blue);
        --accent-tint: var(--blue-tint);
        --glow: color-mix(in srgb, var(--accent) 9%, transparent);
        background: var(--canvas);
        color: var(--text);
      }
      /* Each game gets its own accent so learners always know which project is open. */
      :root[data-lesson="brick-breaker"], [data-lesson-card="brick-breaker"] { --accent: var(--game-brick-breaker); --accent-tint: var(--game-brick-breaker-tint); }
      :root[data-lesson="space-invaders"], [data-lesson-card="space-invaders"] { --accent: var(--game-space-invaders); --accent-tint: var(--game-space-invaders-tint); }
      :root[data-lesson="tower-defense"], [data-lesson-card="tower-defense"] { --accent: var(--game-tower-defense); --accent-tint: var(--game-tower-defense-tint); }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          color-scheme: light;
          --canvas: #eef2f8; --sidebar: #ffffff; --surface: #ffffff; --surface-raised: #f2f5fa; --surface-hover: #e4eaf3;
          --text: #172033; --text-muted: #44506a; --border: #8692a8; --border-subtle: #d3dae6;
          --blue: #1b6a9e; --blue-hover: #13557f; --blue-ink: #ffffff; --blue-tint: #e2eff9;
          --sage: #2c7a52; --sage-tint: #e2f3e9; --butter: #7d5900; --butter-tint: #fff5d9; --peach: #a3443d;
          --header-bg: linear-gradient(115deg, #ffffff 0%, #eef3fb 100%);
          --checkpoint-text: #3d2f00; --complete-text: #153d29; --complete-hover: #cfeadb;
          --notice: #44506a; --error: #9b1c1c; --focus: #1b6a9e; --game-brick-breaker: #b4560f; --game-brick-breaker-tint: #fdebdc; --game-space-invaders: #23783f; --game-space-invaders-tint: #e0f4e6; --game-tower-defense: #6447c2; --game-tower-defense-tint: #ece7fd;
        }
      }
      :root[data-theme="light"] {
          color-scheme: light;
          --canvas: #eef2f8; --sidebar: #ffffff; --surface: #ffffff; --surface-raised: #f2f5fa; --surface-hover: #e4eaf3;
          --text: #172033; --text-muted: #44506a; --border: #8692a8; --border-subtle: #d3dae6;
          --blue: #1b6a9e; --blue-hover: #13557f; --blue-ink: #ffffff; --blue-tint: #e2eff9;
          --sage: #2c7a52; --sage-tint: #e2f3e9; --butter: #7d5900; --butter-tint: #fff5d9; --peach: #a3443d;
          --header-bg: linear-gradient(115deg, #ffffff 0%, #eef3fb 100%);
          --checkpoint-text: #3d2f00; --complete-text: #153d29; --complete-hover: #cfeadb;
          --notice: #44506a; --error: #9b1c1c; --focus: #1b6a9e; --game-brick-breaker: #b4560f; --game-brick-breaker-tint: #fdebdc; --game-space-invaders: #23783f; --game-space-invaders-tint: #e0f4e6; --game-tower-defense: #6447c2; --game-tower-defense-tint: #ece7fd;
      }
      h1, h2, h3, h4, .step-button, .button, summary, .eyebrow, .chapter-meta { font-family: var(--heading-font); }
      * { box-sizing: border-box; }
      body { background: var(--canvas); display: flex; flex-direction: column; height: 100vh; height: 100dvh; margin: 0; overflow: hidden; }
      button, select { font: inherit; }
      button, summary, select { min-height: 44px; }
      button:focus-visible, summary:focus-visible, select:focus-visible, a:focus-visible {
        box-shadow: 0 0 0 6px color-mix(in srgb, var(--focus) 30%, transparent);
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      a { color: var(--blue); }
      a:hover { color: var(--blue-hover); }
      .site-header {
        align-items: center;
        background: var(--header-bg);
        border-bottom: 3px solid var(--accent);
        display: grid;
        flex-shrink: 0;
        gap: 1.5rem;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        padding: .85rem 1.5rem;
      }
      .site-header h1 { border-left: .2rem solid var(--accent); color: var(--text); font-size: 1.25rem; margin: 0; padding-left: .6rem; white-space: nowrap; }
      .header-tools { display: flex; justify-content: flex-end; }
      .theme-toggle { align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; color: var(--text); cursor: pointer; display: inline-flex; gap: .45rem; padding: .35rem .85rem; }
      .project-picker { align-items: center; display: grid; gap: .75rem; grid-template-columns: auto minmax(0, 16.25rem); min-width: 0; }
      .project-picker label { color: var(--text-muted); font-size: .8rem; font-weight: 600; }
      #lesson-select {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: .55rem;
        color: var(--text);
        min-width: 0;
        padding: .55rem .75rem;
        width: 100%;
      }
      .app-shell { display: grid; flex: 1; grid-template-columns: minmax(16rem, 1fr) minmax(0, 4fr); min-height: 0; }
      .steps-nav { background: var(--sidebar); border-right: 1px solid var(--border-subtle); min-height: 0; overflow-y: auto; padding: 1rem; }
      .steps-nav > h2 { font-size: 1.1rem; font-weight: 700; margin: 0 0 1.5rem; }
      .course-nav-toggle { display: none; }
      .chapter-group { --chapter-accent: var(--blue); }
      .chapter-group:nth-of-type(4n + 2) { --chapter-accent: var(--sage); }
      .chapter-group:nth-of-type(4n + 3) { --chapter-accent: var(--butter); }
      .chapter-group:nth-of-type(4n) { --chapter-accent: var(--peach); }
      .chapter-group { margin: 0 0 .5rem; }
      .chapter-heading { margin: 0; }
      .chapter-toggle {
        background: transparent;
        border: 0;
        border-left: .2rem solid var(--chapter-accent);
        color: var(--text);
        cursor: pointer;
        display: grid;
        gap: .15rem;
        padding: .5rem 2rem .5rem .65rem;
        position: relative;
        text-align: left;
        width: 100%;
      }
      .chapter-toggle::after {
        border-bottom: 2px solid var(--text-muted);
        border-right: 2px solid var(--text-muted);
        content: '';
        height: .45rem;
        position: absolute;
        right: .6rem;
        top: 50%;
        transform: translateY(-70%) rotate(45deg);
        width: .45rem;
      }
      .chapter-toggle[aria-expanded="false"]::after { transform: translateY(-50%) rotate(-45deg); }
      .chapter-title { font-size: .95rem; font-weight: 600; line-height: 1.35; }
      .chapter-meta { color: var(--text-muted); font-size: .75rem; line-height: 1.5; }
      .chapter-group.is-complete .chapter-meta { color: var(--sage); font-weight: 700; }
      .step-list:not([hidden]) { margin: .35rem 0 .75rem; }
      .step-list[hidden] { display: none; }
      .course-progress { display: grid; gap: .4rem; margin: 0 0 1.25rem; }
      .course-progress-label { color: var(--text-muted); font-size: .85rem; font-weight: 600; margin: 0; }
      .step-list { display: grid; gap: .125rem; list-style: none; margin: 0; padding: 0; }
      .step-button {
        background: transparent;
        border: 0;
        border-left: 2px solid transparent;
        border-radius: 0;
        color: var(--text-muted);
        cursor: pointer;
        align-content: center;
        display: grid;
        font-size: .9rem;
        column-gap: .5rem;
        grid-template-columns: 1rem 2.5ch minmax(0, 1fr);
        line-height: 1.5;
        padding: .45rem .6rem;
        text-align: left;
        width: 100%;
      }
      .step-button[aria-current="step"] { background: var(--accent-tint); border-left-color: var(--accent); color: var(--text); font-weight: 600; }
      .step-number { font-variant-numeric: tabular-nums; text-align: right; }
      .step-label { min-width: 0; }
      .step-dot { align-self: center; border: 2px solid var(--border); border-radius: 50%; height: .8rem; width: .8rem; }
      .step-button[aria-current="step"] .step-dot { border-color: var(--accent); }
      .step-button.is-complete .step-dot { background: var(--sage); border-color: var(--sage); box-shadow: inset 0 0 0 2px var(--sidebar); }
      .step-button.is-complete .step-label { color: var(--text); }
      .content-area {
        background:
          radial-gradient(circle at 92% 2%, var(--glow), transparent 24rem),
          var(--canvas);
        min-height: 0;
        overflow-y: auto;
        padding: 2rem clamp(1rem, 4vw, 3rem);
        scroll-behavior: smooth;
      }
      .content-column { margin: 0 auto; max-width: 1200px; width: 100%; }
      .card, article.content-column {
        background: var(--surface);
        border: 1px solid var(--border-subtle);
        border-radius: .85rem;
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 24%);
        padding: clamp(1rem, 4vw, 2rem);
      }
      .card > h2 { border-left: .2rem solid var(--accent); padding-left: .6rem; }
      .card > h2 { font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 700; line-height: 1.2; margin: 0 0 1.25rem; }
      .eyebrow { align-items: center; color: var(--text-muted); display: flex; flex-wrap: wrap; font-size: .85rem; font-weight: 600; gap: .6rem; margin: 0; }
      .step-badge { background: var(--accent); border-radius: 999px; color: var(--canvas); font-size: .8rem; font-weight: 700; padding: .2rem .7rem; white-space: nowrap; }
      h2, h3, h4 { color: var(--text); }
      .content-column > h3 { font-size: 1.15rem; font-weight: 600; margin: 1.75rem 0 .65rem; }
      .content-column > .section-heading { margin: 1.75rem 0 .65rem; }
      .step-title { border-left: .2rem solid transparent; font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.15; margin: .75rem 0 1.5rem; padding-left: .6rem; }
      #content-heading[tabindex="-1"]:focus { border-left-color: var(--butter); outline: 0; }
      .narrated-heading { align-items: center; display: flex; gap: .75rem; }
      .narrated-heading .step-title { margin-bottom: 1rem; min-width: 0; }
      .narrated-heading h3 { font-size: 1.15rem; font-weight: 600; line-height: 1.4; margin: 0; min-width: 0; }
      .narrated-section, .narrated-list-row { align-items: flex-start; display: flex; gap: .5rem; }
      .narrated-section > .prose { margin-top: .15rem; }
      .narrated-list-row > span:last-child { min-width: 0; }
      .narration-slot { display: inline-flex; flex: 0 0 auto; }
      .details-content > .narration-slot { display: flex; justify-content: flex-end; margin-bottom: .5rem; }
      .details-content.narrated-help { align-items: flex-start; display: flex; gap: .75rem; }
      .narrated-help > .narration-slot { margin: 0; }
      .narrated-help > .narration-slot:empty { display: none; }
      .narrated-help > .prose { flex: 1; margin: 0; min-width: 0; padding-top: 0; }
      .narrated-help > ol.instruction-list { list-style: decimal outside; padding-left: 1.25rem; }
      .narrated-help > ol.instruction-list > li { margin: .35rem 0 0; }
      .narrated-help > ol.instruction-list > li:first-child { margin-top: 0; }
      .narrated-help > ol.instruction-list > li::marker { color: var(--text-muted); font-variant-numeric: tabular-nums; }
      .narration-button {
        align-items: center;
        background: var(--blue-tint);
        border: 1px solid var(--blue);
        border-radius: 999px;
        color: var(--blue);
        cursor: pointer;
        display: inline-flex;
        height: 34px;
        justify-content: center;
        min-height: 0;
        padding: 0;
        width: 34px;
      }
      .narration-button:hover { background: var(--surface-raised); }
      .narration-button[data-state="loading"] { opacity: .75; }
      .narration-button svg { fill: currentColor; height: 16px; width: 16px; }
      .narrated-help .narration-button { background: transparent; border-color: var(--border); height: 28px; width: 28px; }
      .narrated-help .narration-button:hover { background: var(--surface-raised); }
      .narrated-help .narration-button svg { height: 12px; width: 12px; }
      .narrated-list-row .narration-button { background: transparent; border-color: var(--border); height: 28px; width: 28px; }
      .narrated-list-row > span:last-child { padding-top: 0; }
      .narrated-list-row .narration-button:hover { background: var(--surface-raised); }
      .narrated-list-row .narration-button svg { height: 12px; width: 12px; }
      .course-start-actions { display: flex; margin-top: 1.5rem; }
      .home-intro { color: var(--text-muted); font-size: 1.15rem; margin: 0 0 1.75rem; max-width: 60ch; }
      .game-grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); list-style: none; margin: 0; padding: 0; }
      .game-card { background: var(--surface-raised); border: 1px solid var(--border-subtle); border-radius: .85rem; display: flex; flex-direction: column; overflow: hidden; }
      .game-card-art { background: var(--accent-tint); border-bottom: 3px solid var(--accent); color: var(--accent); }
      .game-card-art svg { display: block; height: auto; width: 100%; }
      .game-card-body { display: flex; flex: 1; flex-direction: column; gap: .6rem; padding: 1.1rem 1.2rem 1.25rem; }
      .game-card h3 { font-size: 1.35rem; margin: 0; }
      .game-card-description { -webkit-box-orient: vertical; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; margin: 0; overflow: hidden; }
      .game-card-meta { color: var(--text-muted); font-size: .9rem; margin: 0; }
      .progress-track { background: var(--surface-hover); border-radius: 999px; height: .55rem; overflow: hidden; }
      .progress-fill { background: var(--accent); border-radius: inherit; height: 100%; }
      .game-card .button { background: var(--accent); border-color: var(--accent); color: var(--canvas); margin-top: auto; }
      /* The home page has no chapters, so it uses the full width. */
      .is-home .steps-nav { display: none; }
      .is-home .app-shell { grid-template-columns: minmax(0, 1fr); }
      .home-link { color: inherit; text-decoration: none; }
      .home-link:hover { color: var(--accent); }
      .prose { color: var(--text-muted); font-size: 1.1rem; line-height: 1.7; max-width: 100%; overflow-x: auto; }
      /* Keep reading lines near 75 characters on wide screens. */
      .content-column > .prose, .content-column > .narrated-section, .build-instructions, .checkpoint { max-width: 78ch; }
      .inline-chip {
        --chip: var(--text-muted);
        background: color-mix(in srgb, var(--chip) 20%, var(--surface));
        border: 1px solid color-mix(in srgb, var(--chip) 75%, transparent);
        border-radius: .45em;
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
        color: var(--text);
        font-family: inherit;
        font-size: .92em;
        font-weight: 600;
        margin: 0 .1em;
        padding: .05em .45em;
      }
      .chip-name { background: var(--surface-raised); border-color: var(--border-subtle); border-style: dashed; }
      .chip-motion { --chip: #4c97ff; }
      .chip-looks { --chip: #9966ff; }
      .chip-sound { --chip: #cf63cf; }
      .chip-events { --chip: #ffbf00; }
      .chip-control { --chip: #ffab19; }
      .chip-sensing { --chip: #5cb1d6; }
      .chip-operators { --chip: #59c059; }
      .chip-variables { --chip: #ff8c1a; }
      .chip-my-blocks { --chip: #ff6680; }
      .instruction-list, .criteria-list { padding-left: 1.4rem; }
      .instruction-list li, .criteria-list li { margin: .5rem 0; }
      .build-instructions { display: grid; gap: 1rem; list-style: none; margin: .75rem 0 0; padding-left: 0; }
      .build-instructions > li { margin: 0; }
      .instruction-number { color: var(--text-muted); font-variant-numeric: tabular-nums; text-align: right; }
      .build-instructions .narrated-list-row { align-items: baseline; column-gap: .5rem; display: grid; grid-template-columns: 28px 1.25rem 2.5ch minmax(0, 1fr); min-width: 0; }
      .build-instructions .narrated-list-row:has(> .narration-slot:empty) { grid-template-columns: 1.25rem 2.5ch minmax(0, 1fr); }
      .instruction-check { accent-color: var(--accent); cursor: pointer; height: 1.15rem; margin: 0; min-height: 0; position: relative; top: .15rem; width: 1.15rem; }
      .build-instructions > li.is-checked .instruction-number,
      .build-instructions > li.is-checked .instruction-number + span { opacity: .6; }
      .tick-count { background: var(--surface-raised); border: 1px solid var(--border-subtle); border-radius: 999px; color: var(--text-muted); font-size: .8rem; font-weight: 700; padding: .15rem .65rem; }
      .tick-count.is-done { background: var(--sage-tint); border-color: var(--sage); color: var(--complete-text); }
      .button-complete[aria-pressed="true"] { background: var(--sage); border-color: var(--sage); color: var(--canvas); }
      .button-complete[aria-pressed="true"]::before { content: '\2713  '; font-weight: 700; }
      .celebration { background: var(--sage-tint); border: 1px solid var(--sage); border-radius: .75rem; color: var(--complete-text); margin-top: 1.5rem; overflow: hidden; padding: 1rem 1.25rem; position: relative; }
      .celebration p { margin: .2rem 0; position: relative; }
      .celebration-title { font-family: var(--heading-font); font-size: 1.25rem; font-weight: 700; }
      .confetti { inset: 0; pointer-events: none; position: absolute; }
      .confetti span { animation: confetti-fall 1.4s ease-in var(--delay) forwards; background: hsl(var(--hue) 85% 62%); border-radius: 2px; height: .55rem; left: var(--x); opacity: 0; position: absolute; top: -1rem; width: .35rem; }
      @keyframes confetti-fall {
        0% { opacity: 1; transform: translateY(0) rotate(0deg); }
        100% { opacity: 0; transform: translateY(9rem) rotate(540deg); }
      }
      .build-instructions .narration-slot:empty { display: none; }
      .checkpoint { background: var(--butter-tint); border: 1px solid var(--butter); border-radius: .65rem; color: var(--checkpoint-text); margin-top: 1.5rem; padding: 1rem; }
      .checkpoint h3 { color: var(--butter); margin-top: 0; }
      .checkpoint p { line-height: 1.6; margin: 0; }
      .checkpoint .checkpoint-task { margin-top: .75rem; }
      .checkpoint h4 { color: var(--butter); font-size: .9rem; font-weight: 600; line-height: 1.5; margin: 1.25rem 0 .35rem; }
      .checkpoint .criteria-list { line-height: 1.6; list-style: disc outside; margin: 0; padding-left: 1.4rem; }
      .checkpoint .criteria-list li { margin: .35rem 0 0; }
      .checkpoint .criteria-list li::marker { color: var(--butter); }
      details { background: var(--surface-raised); border: 1px solid var(--border); border-radius: .55rem; margin-top: .65rem; }
      summary { align-items: center; cursor: pointer; display: flex; font-weight: 600; gap: 1rem; padding: .75rem 2.5rem .75rem .75rem; position: relative; }
      summary::after {
        border-bottom: 2px solid var(--blue);
        border-right: 2px solid var(--blue);
        content: '';
        flex: 0 0 auto;
        height: .55rem;
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-65%) rotate(45deg);
        width: .55rem;
      }
      details[open] > summary::after { transform: translateY(-35%) rotate(225deg); }
      summary::marker { content: ''; }
      summary::-webkit-details-marker { display: none; }
      .details-content { border-top: 1px solid var(--border-subtle); padding: 1rem; }
      .code-scroll { max-width: 100%; overflow-x: auto; }
      .code-label { color: var(--text-muted); font-size: .85rem; font-weight: 600; }
      /* The pinned Scratchblocks build leaves My Block inputs unstyled. */
      svg.scratchblocks-style-scratch3 .sb3-custom-arg { fill: #ff6680; stroke: #ff3355; }
      .step-actions { align-items: center; border-top: 1px solid var(--border-subtle); display: flex; flex-wrap: wrap; gap: .75rem; justify-content: space-between; margin-top: 2rem; padding-top: 1.25rem; }
      .button { border: 1px solid var(--border); border-radius: .55rem; cursor: pointer; font-weight: 600; padding: .65rem 1rem; }
      .button-secondary { background: var(--surface-raised); color: var(--text); }
      .button-primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
      .button-complete { background: var(--sage-tint); border-color: var(--sage); color: var(--complete-text); }
      .status { margin: 0; padding: .5rem 1rem; }
      .error { color: var(--error); }
      .notice { color: var(--notice); font-size: .9rem; }
      .video-container { aspect-ratio: 16 / 9; margin-top: 1.5rem; overflow: hidden; }
      .video-container iframe { border: 0; height: 100%; width: 100%; }
      .cat-motion { color: #75adff; font-weight: 600; }
      .cat-looks { color: #b794ff; font-weight: 600; }
      .cat-sound { color: #e68ae6; font-weight: 600; }
      .cat-events { color: #ffd04a; font-weight: 600; }
      .cat-control { color: #ffc15c; font-weight: 600; }
      .cat-sensing { color: #79c9e8; font-weight: 600; }
      .cat-operators { color: #7bd47b; font-weight: 600; }
      .cat-variables { color: #ffad55; font-weight: 600; }
      .cat-my-blocks { color: #ff8ca0; font-weight: 600; }
      .visually-hidden {
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }
      @media (hover: hover) {
        .step-button:hover { background: var(--surface-hover); color: var(--text); }
        .step-button[aria-current="step"]:hover { background: color-mix(in srgb, var(--accent) 20%, var(--accent-tint)); }
        summary:hover { color: var(--blue-hover); }
        summary:hover::after { border-color: var(--blue-hover); }
        .button-secondary:hover { background: var(--surface-hover); }
        .button-primary:hover { background: var(--blue-hover); border-color: var(--blue-hover); }
        .button-complete:hover { background: var(--complete-hover); }
      }
      @media (max-width: 767px) {
        body { height: auto; min-height: 100vh; min-height: 100dvh; overflow: visible; }
        .site-header { align-items: center; grid-template-columns: minmax(0, 1fr) auto; gap: .75rem; padding: 1rem; }
        .project-picker { grid-column: 1 / -1; grid-row: 2; }
        .site-header h1 { white-space: normal; }
        .project-picker { grid-template-columns: auto minmax(0, 1fr); }
        .app-shell { display: block; height: auto; }
        .steps-nav { border-bottom: 1px solid var(--border-subtle); border-right: 0; max-height: none; overflow: visible; }
        .steps-nav > h2 { display: inline-block; margin-right: .75rem; }
        .course-nav-toggle { background: var(--surface-raised); border: 1px solid var(--border); border-radius: .55rem; color: var(--text); cursor: pointer; display: inline-block; padding: .45rem .75rem; }
        #steps-list.mobile-collapsed { display: none; }
        .content-area { overflow: visible; padding: 1rem; scroll-behavior: auto; }
      }
      @media (forced-colors: active) {
        .site-header, .content-area, .card, article.content-column { background: Canvas; }
        #lesson-select, .button, .checkpoint, details { border: 2px solid ButtonText; }
        .step-button[aria-current="step"] { border: 2px solid Highlight; }
        .completion-mark { color: CanvasText; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
        .confetti { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <h1><a class="home-link" href="./">Scratch Lessons</a></h1>
      <div class="project-picker">
        <label for="lesson-select">Project</label>
        <select id="lesson-select" disabled>
          <option selected>Loading projects...</option>
        </select>
      </div>
      <div class="header-tools">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Light mode</button>
      </div>
    </header>
    <p id="app-status" class="status visually-hidden" role="status" aria-live="polite"></p>
    <p id="app-error" class="status error visually-hidden" role="alert"></p>
    <p id="narration-status" class="status notice visually-hidden" role="status" aria-live="polite"></p>
    <main class="app-shell">
      <nav class="steps-nav" aria-labelledby="steps-heading">
        <h2 id="steps-heading">Course chapters</h2>
        <button id="course-nav-toggle" class="course-nav-toggle" type="button" aria-controls="steps-list" aria-expanded="false">Show chapters</button>
        <div id="steps-list" class="mobile-collapsed"></div>
      </nav>
      <section id="content-area" class="content-area" aria-labelledby="content-heading">
        <div class="content-column card">
          <h2 id="content-heading">Welcome</h2>
          <p>Select a project to begin.</p>
        </div>
      </section>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
